<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14503f"/>
      <stop offset="0.55" stop-color="#0d3a30"/>
      <stop offset="1" stop-color="#07241e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.6" stop-color="#f7f0e1"/>
      <stop offset="1" stop-color="#efe4cf"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="150" cy="90" r="220" fill="#ffffff" opacity="0.035"/>

  <g filter="url(#shadow)" transform="rotate(-13 205 275)">
    <rect x="120" y="155" width="170" height="240" rx="16" fill="url(#card)" stroke="#d9a441" stroke-width="5"/>
    <text x="142" y="213" font-family="Georgia, serif" font-size="62" font-weight="bold" fill="#b3261e">A</text>
    <text x="205" y="330" font-family="Georgia, serif" font-size="126" fill="#b3261e" text-anchor="middle">♥</text>
  </g>

  <g filter="url(#shadow)" transform="rotate(11 330 250)">
    <rect x="245" y="130" width="170" height="240" rx="16" fill="url(#card)" stroke="#d9a441" stroke-width="5"/>
    <text x="267" y="188" font-family="Georgia, serif" font-size="62" font-weight="bold" fill="#241f18">A</text>
    <text x="330" y="305" font-family="Georgia, serif" font-size="126" fill="#241f18" text-anchor="middle">♠</text>
  </g>

  <circle cx="256" cy="430" r="28" fill="#d9a441"/>
  <text x="256" y="441" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="30" font-weight="bold" fill="#0d3a30" text-anchor="middle">花</text>
</svg>
